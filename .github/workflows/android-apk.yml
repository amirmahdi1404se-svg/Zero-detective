name: Build CASE ZERO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Download Godot .NET editor
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" \
            -o godot.zip
          mkdir godot-bin
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot_*_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          mv "$GODOT_BIN" godot-bin/godot
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Install matching Godot .NET export templates
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" \
            -o templates.tpz
          mkdir templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp -a templates-unpacked/templates/. "$TEMPLATE_DIR/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Import project and compile C#
        shell: bash
        run: |
          godot --headless --editor --path . --import
          godot --headless --editor --path . --build-solutions --quit
          dotnet build CaseZero.csproj --configuration Release

      - name: Export APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CASE-ZERO-debug.apk
          test -s build/CASE-ZERO-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CASE-ZERO-Android-APK
          path: build/CASE-ZERO-debug.apk
          if-no-files-found: error
          retention-days: 14
